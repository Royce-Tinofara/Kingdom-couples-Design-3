<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Couples — Two Hearts. One Kingdom. One Purpose.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-900: #030a16;
  --navy-800: #0a1832;
  --navy-700: #122548;
  --gold-400: #f1d37e;
  --gold-500: #d4af37;
  --gold-600: #aa8625;
  --gold-gradient: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #c79515 100%);
  --gold-glow: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(3,10,22,0) 70%);
  --glass-bg: rgba(10, 24, 50, 0.55);
  --glass-border: rgba(212, 175, 55, 0.2);
  --glass-hover: rgba(18, 37, 72, 0.75);
  --text-main: #f4f6fa;
  --text-muted: #94a3b8;
  --text-gold: #e6c86e;
  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: inherit; }

html { scroll-behavior: smooth; scroll-padding-top: 80px; }

body {
  margin: 0;
  background-color: var(--navy-900);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 1.05rem;
  line-height: 1.7;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(212,175,55,0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(18,37,72,0.5) 0%, transparent 50%);
  background-attachment: fixed;
}

h1, h2, h3, h4 {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.02em;
  margin: 0;
}

.gold-text {
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

/* Animations */
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.5deg); }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.08); }
}

@keyframes strokeDraw {
  to { stroke-dashoffset: 0; }
}

@keyframes fillIn {
  to { fill-opacity: 1; stroke-opacity: 0.3; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.animate-fade-in.in {
  opacity: 1;
  transform: translateY(0);
}

/* Header */
header.top {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(3, 10, 22, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  transition: all 0.3s ease;
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem;
}

header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 80px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--gold-400);
}

.brand svg {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 8px rgba(212,175,55,0.4));
}

nav.main-nav {
  display: flex;
  gap: 2.2rem;
  align-items: center;
}

nav.main-nav a {
  position: relative;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: color 0.3s ease;
  padding: 0.5rem 0;
}

nav.main-nav a:hover, nav.main-nav a[aria-current="page"] {
  color: var(--gold-400);
}

nav.main-nav a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--gold-gradient);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius: 2px;
}

nav.main-nav a:hover::after, nav.main-nav a[aria-current="page"]::after {
  transform: scaleX(1);
  transform-origin: left;
}

/* Hero Section */
.hero {
  position: relative;
  padding: 180px 0 100px;
  text-align: center;
  overflow: hidden;
}

.hero-glow {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: var(--gold-glow);
  pointer-events: none;
  animation: pulseGlow 6s ease-in-out infinite;
  z-index: 0;
}

.hero .wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-container {
  position: relative;
  cursor: pointer;
  margin-bottom: 2rem;
  transition: transform 0.4s ease;
}

.logo-container:hover {
  transform: scale(1.02);
}

.lg {
  width: min(480px, 85vw);
  height: auto;
}

.lg path {
  fill: var(--gold-500);
  fill-opacity: 0;
  stroke: var(--gold-400);
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: strokeDraw var(--du, 1.4s) cubic-bezier(0.45, 0, 0.25, 1) var(--dl, 0s) forwards,
             fillIn 1s ease 2.2s forwards;
}

.tagline-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  margin-top: 1.5rem;
  width: 100%;
}

.tagline {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-main);
  text-wrap: balance;
}

.fl-line {
  flex: 1;
  max-width: 140px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-500), transparent);
}

.next-bar {
  margin-top: 3.5rem;
  padding: 1rem 2rem;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  backdrop-filter: blur(12px);
  font-size: 0.98rem;
  color: var(--text-muted);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
}

.next-bar a {
  color: var(--gold-400);
  font-weight: 600;
  text-decoration: none;
}

.next-bar a:hover { text-decoration: underline; }

/* Buttons */
.btn-group {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 2.5rem;
}

.btn {
  padding: 0.95rem 2.2rem;
  border-radius: 50px;
  font-weight: 600;
  font-size: 0.98rem;
  letter-spacing: 0.03em;
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
}

.btn-gold {
  background: var(--gold-gradient);
  color: var(--navy-900);
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
}

.btn-gold:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
}

.btn-outline {
  background: transparent;
  color: var(--text-main);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(8px);
}

.btn-outline:hover {
  background: rgba(212, 175, 55, 0.1);
  border-color: var(--gold-400);
  transform: translateY(-3px);
}

/* Sections */
.pad { padding: 7rem 0; }
.soft-bg {
  background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 50%, var(--navy-900) 100%);
  position: relative;
}

.section-title {
  font-size: clamp(2.2rem, 4vw, 3.2rem);
  color: var(--text-main);
  margin-bottom: 1rem;
}

.gold-divider {
  width: 70px;
  height: 3px;
  background: var(--gold-gradient);
  border-radius: 2px;
  margin-bottom: 2rem;
}

.gold-divider.center { margin-left: auto; margin-right: auto; }

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}

@media (max-width: 850px) {
  .two-col { grid-template-columns: 1fr; gap: 2.5rem; }
}

.statement-box {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 3rem;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.statement-text {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.4rem, 2.5vw, 1.9rem);
  color: var(--gold-400);
  line-height: 1.4;
}

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 2rem;
  margin-top: 3.5rem;
}

.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 2.5rem 2rem;
  backdrop-filter: blur(12px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.glass-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 3px;
  background: var(--gold-gradient);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.glass-card:hover {
  transform: translateY(-8px);
  background: var(--glass-hover);
  border-color: rgba(212, 175, 55, 0.4);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.glass-card:hover::before { opacity: 1; }

.glass-card h3 {
  font-size: 1.5rem;
  color: var(--gold-400);
  margin-bottom: 0.8rem;
}

.glass-card p {
  color: var(--text-muted);
  font-size: 1rem;
  line-height: 1.6;
  margin: 0;
}

/* Events List */
.events-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}

.tabs-group {
  display: flex;
  background: var(--navy-800);
  padding: 5px;
  border-radius: 50px;
  border: 1px solid var(--glass-border);
}

.tabs-group button {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 0.6rem 1.6rem;
  border-radius: 50px;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tabs-group button[aria-pressed="true"] {
  background: var(--gold-gradient);
  color: var(--navy-900);
  box-shadow: 0 4px 15px rgba(212,175,55,0.3);
}

.event-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 2rem 2.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: 140px 1fr auto;
  gap: 2.5rem;
  align-items: center;
  transition: all 0.3s ease;
}

.event-card:hover {
  border-color: var(--gold-400);
  transform: translateX(6px);
  background: var(--glass-hover);
}

.event-date {
  text-align: center;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: var(--radius-md);
  padding: 1rem;
}

.event-date .day {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--gold-400);
  line-height: 1;
}

.event-date .month-yr {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 0.4rem;
}

.event-info h3 {
  font-size: 1.45rem;
  color: var(--text-main);
  margin-bottom: 0.4rem;
}

.event-info .meta {
  color: var(--gold-400);
  font-weight: 600;
  font-size: 0.95rem;
  margin-bottom: 0.6rem;
}

.event-info p {
  color: var(--text-muted);
  margin: 0;
}

.btn-cal {
  color: var(--gold-400);
  border: 1px solid var(--glass-border);
  padding: 0.6rem 1.2rem;
  border-radius: 50px;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.3s ease;
}

.btn-cal:hover {
  background: var(--gold-gradient);
  color: var(--navy-900);
}

@media (max-width: 768px) {
  .event-card {
    grid-template-columns: 1fr;
    gap: 1.2rem;
    padding: 1.5rem;
  }
  .event-date {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 1.2rem;
  }
}

/* Scripture Band */
.scripture-band {
  background: linear-gradient(135deg, rgba(10,24,50,0.95) 0%, rgba(3,10,22,0.95) 100%);
  border-y: 1px solid var(--glass-border);
  padding: 6rem 0;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.scripture-band blockquote {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.6rem, 3.5vw, 2.5rem);
  color: var(--gold-400);
  max-width: 28ch;
  margin: 0 auto;
  line-height: 1.35;
  font-style: italic;
}

.scripture-band cite {
  display: block;
  margin-top: 1.5rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-style: normal;
  font-size: 0.95rem;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Steps */
.timeline {
  position: relative;
  max-width: 700px;
  margin: 3rem auto 0;
  padding-left: 2.5rem;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: var(--gold-gradient);
}

.timeline-step {
  position: relative;
  padding-bottom: 2.5rem;
}

.timeline-step::before {
  content: '';
  position: absolute;
  left: -2.85rem;
  top: 6px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--navy-900);
  border: 3px solid var(--gold-500);
  box-shadow: 0 0 10px rgba(212,175,55,0.5);
}

.timeline-step h3 {
  font-size: 1.4rem;
  color: var(--gold-400);
  margin-bottom: 0.4rem;
}

/* FAQ Details */
.faq-list {
  max-width: 800px;
  margin: 3rem auto 0;
}

.faq-item {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  margin-bottom: 1rem;
  padding: 1.2rem 1.8rem;
  transition: background 0.3s ease;
}

.faq-item summary {
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text-main);
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.faq-item summary::after {
  content: '+';
  font-size: 1.5rem;
  color: var(--gold-400);
  transition: transform 0.3s ease;
}

.faq-item[open] summary::after {
  transform: rotate(45deg);
}

.faq-item p {
  margin-top: 1rem;
  color: var(--text-muted);
}

/* Contact Box */
.contact-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 3.5rem;
  max-width: 700px;
  margin: 0 auto;
  text-align: center;
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* Page Header Band */
.page-header {
  padding: 150px 0 60px;
  text-align: center;
  background: linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
  border-bottom: 1px solid var(--glass-border);
}

.page-header h1 {
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--gold-400);
}

.page-header p {
  color: var(--text-muted);
  font-size: 1.15rem;
  margin-top: 1rem;
}

/* Footer */
footer {
  border-top: 1px solid var(--glass-border);
  background: var(--navy-900);
  padding: 4rem 0;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.95rem;
}

footer svg {
  height: 54px;
  width: auto;
  margin-bottom: 1rem;
  filter: drop-shadow(0 0 10px rgba(212,175,55,0.3));
}

footer .brand-mark {
  font-family: 'Cinzel', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold-400);
}

footer nav {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin: 1.8rem 0;
  flex-wrap: wrap;
}

footer nav a {
  color: var(--text-main);
  text-decoration: none;
  transition: color 0.3s ease;
}

footer nav a:hover { color: var(--gold-400); }

/* Page Enter Animation */
#app.page-transition {
  animation: pageEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 640px) {
  nav.main-nav { gap: 1rem; }
  nav.main-nav a { font-size: 0.88rem; }
  .brand span.nm { display: none; }
}
</style>
</head>

<defs><linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fceabb"/><stop offset="50%" stop-color="#f8b500"/><stop offset="100%" stop-color="#c79515"/></linearGradient></defs>

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const today=new Date(); today.setHours(0,0,0,0);
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sorted=v=>EVENTS.filter(e=>v==="upcoming"?parse(e.date)>=today:parse(e.date)<today)
  .sort((a,b)=>v==="upcoming"?parse(a.date)-parse(b.date):parse(b.date)-parse(a.date));

function calLink(e){
  const d=parse(e.date), p=n=>String(n).padStart(2,"0");
  const f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());
  const n=new Date(d); n.setDate(n.getDate()+1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+
    "&dates="+f(d)+"/"+f(n)+"&location="+encodeURIComponent(e.place)+"&details="+encodeURIComponent(e.text+" (Time: "+e.time+")");
}

function eventCardsHtml(items, view, emptyMsg) {
  if(!items.length) return `<div class="glass-card text-center" style="grid-column: 1/-1; color: var(--text-muted);">${emptyMsg}</div>`;
  return items.map(e => {
    const d = parse(e.date);
    return `
    <div class="event-card animate-fade-in">
      <div class="event-date">
        <div class="day">${d.getDate()}</div>
        <div class="month-yr">${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}</div>
      </div>
      <div class="event-info">
        <h3>${esc(e.title)}</h3>
        <div class="meta">${esc(e.time)} &bull; ${esc(e.place)}</div>
        <p>${esc(e.text)}</p>
      </div>
      ${view === "upcoming" ? `<a class="btn-cal" href="${calLink(e)}" target="_blank" rel="noopener">+ Calendar</a>` : `<div></div>`}
    </div>`;
  }).join("");
}

const noUp = "No upcoming events right now. Follow our Facebook page to stay updated.";

function initScrollAnimations() {
  const els = document.querySelectorAll('.animate-fade-in');
  if(!("IntersectionObserver" in window)) {
    els.forEach(e => e.classList.add('in'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting) {
        entry.target.classList.add('in');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(e => observer.observe(e));
}

}

const app = document.getElementById("app");
function route() {
  let p = (location.hash || "").replace(/^#/, "") || "/";
  if(!pages[p]) p = "/";
  const pg = pages[p];
  
  app.classList.remove("page-transition");
  void app.offsetWidth;
  app.innerHTML = pg.html();
  app.classList.add("page-transition");
  
  document.title = pg.title;
  document.querySelectorAll("#mainNav a").forEach(a => {
    if(a.dataset.r === p) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  
  if(pg.after) pg.after();
  window.scrollTo(0, 0);
  initScrollAnimations();
}

document.querySelectorAll("[data-sym]").forEach(el => {
  el.innerHTML = symSVG();
  if(el.hasAttribute("data-big")) el.style.display = "block";
});

document.getElementById("yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
